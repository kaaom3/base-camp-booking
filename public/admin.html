<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base Camp - Admin Dashboard (Gamer Theme)</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* GAMER THEME OVERRIDES */
        :root {
            --neon-blue: #00f3ff;
            --neon-purple: #bc13fe;
            --neon-pink: #ff007f;
            --neon-green: #39ff14;
            --dark-bg: #0a0a10;
            --panel-bg: #13141f;
        }

        body.admin-body {
            background-color: var(--dark-bg);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(188, 19, 254, 0.1), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(0, 243, 255, 0.1), transparent 25%);
            color: #e0e0e0;
            font-family: 'Kanit', sans-serif;
            min-height: 100vh;
        }

        .admin-header {
            background: linear-gradient(90deg, #0f0c29, #302b63, #24243e);
            border-bottom: 2px solid var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
            padding: 30px;
        }

        .admin-header h1 {
            font-family: 'Orbitron', sans-serif;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-blue), 0 0 20px var(--neon-blue);
            letter-spacing: 2px;
            margin: 0;
            font-size: 28px;
        }
        
        .admin-header p {
            color: #a0a0ff;
            margin: 5px 0 0 0;
            font-family: 'Orbitron', 'Kanit', sans-serif;
        }

        .card {
            background: var(--panel-bg);
            border: 1px solid rgba(0, 243, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            color: #fff;
            padding: 30px;
            margin-bottom: 30px;
        }

        .section-title {
            color: var(--neon-blue);
            font-family: 'Orbitron', 'Kanit', sans-serif;
            text-shadow: 0 0 5px rgba(0, 243, 255, 0.5);
            border-bottom: 1px dashed rgba(0, 243, 255, 0.3);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        /* Input Styles */
        .admin-input {
            background: #0f1016;
            border: 1px solid #333;
            color: #00f3ff;
            font-family: 'Orbitron', 'Kanit', sans-serif;
            padding: 12px 20px;
            border-radius: 6px;
            outline: none;
            width: 100%;
            transition: 0.3s;
        }
        .admin-input:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
            background: #000;
        }
        
        .flex-row {
            display: flex;
            gap: 15px;
        }

        /* Buttons */
        .btn-checkin, .btn-refresh {
            background: linear-gradient(45deg, var(--neon-purple), var(--neon-blue));
            color: white;
            border: none;
            border-radius: 4px;
            text-transform: uppercase;
            font-weight: bold;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(188, 19, 254, 0.4);
            cursor: pointer;
            padding: 0 30px;
            white-space: nowrap;
        }
        .btn-checkin:hover, .btn-refresh:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.6);
        }
        
        .btn-refresh {
            padding: 8px 20px;
            font-size: 14px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }
        .tab-btn {
            padding: 12px 30px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 4px;
            font-size: 16px;
            font-family: 'Orbitron', 'Kanit', sans-serif;
            color: #888;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }
        .tab-btn:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }
        .tab-btn.active {
            background: rgba(0, 243, 255, 0.1);
            border-color: var(--neon-blue);
            color: var(--neon-blue);
            box-shadow: inset 0 0 10px rgba(0, 243, 255, 0.2), 0 0 10px rgba(0, 243, 255, 0.2);
            text-shadow: 0 0 5px var(--neon-blue);
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Tables */
        .table-responsive {
            overflow-x: auto;
        }
        .schedule-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background: transparent;
            text-align: left;
        }
        .schedule-table th {
            background: rgba(0, 243, 255, 0.1);
            color: var(--neon-blue);
            text-transform: uppercase;
            font-family: 'Orbitron', 'Kanit', sans-serif;
            border-bottom: 2px solid var(--neon-blue);
            padding: 15px;
            font-weight: 600;
        }
        .schedule-table td {
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: #ccc;
        }
        .schedule-table tr:hover td {
            background: rgba(255, 255, 255, 0.05);
        }

        /* Action Buttons */
        .btn-sm-checkin {
            background: transparent;
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
            padding: 6px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Orbitron', 'Kanit', sans-serif;
            transition: 0.3s;
        }
        .btn-sm-checkin:hover {
            background: var(--neon-green);
            color: #000;
            box-shadow: 0 0 10px var(--neon-green);
        }

        .btn-sm-doc {
            background: transparent;
            color: var(--neon-blue);
            border: 1px solid var(--neon-blue);
            padding: 6px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Orbitron', 'Kanit', sans-serif;
            transition: 0.3s;
        }
        .btn-sm-doc:hover {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 10px var(--neon-blue);
        }

        .btn-cancel {
            background: transparent;
            color: var(--neon-pink);
            border: 1px solid var(--neon-pink);
            padding: 6px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Orbitron', 'Kanit', sans-serif;
            transition: 0.3s;
        }
        .btn-cancel:hover {
            background: var(--neon-pink);
            color: #fff;
            box-shadow: 0 0 10px var(--neon-pink);
        }

        /* Status badges */
        .status-badge {
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            font-family: 'Orbitron', sans-serif;
        }
        .status-pending { background: rgba(255, 204, 0, 0.1); color: #ffcc00; border: 1px solid #ffcc00; }
        .status-checked-in { background: rgba(57, 255, 20, 0.1); color: var(--neon-green); border: 1px solid var(--neon-green); }
        .status-cancelled { background: rgba(255, 0, 127, 0.1); color: var(--neon-pink); border: 1px solid var(--neon-pink); }
        
        .msg {
            color: var(--neon-green);
        }
        .msg.error {
            color: var(--neon-pink);
        }

    </style>
</head>
<body class="admin-body">
    <header class="admin-header">
        <div style="display: flex; align-items: center; gap: 20px; justify-content: center;">
            <img src="images/logo.png" alt="Base Camp" style="max-height: 60px; width: auto; filter: drop-shadow(0 0 10px rgba(0,243,255,0.8));">
            <div style="text-align: left;">
                <h1>BASE CAMP ADMIN</h1>
                <p>CYBER DASHBOARD V2.0 &bull; <span id="current-date" style="color: #fff;"></span></p>
            </div>
        </div>
    </header>

    <div class="admin-container">
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('schedule')">🎮 Live Schedule</button>
            <button class="tab-btn" onclick="switchTab('history')">📂 Data Logs</button>
        </div>

        <div id="tab-schedule" class="tab-content active">
            <!-- Manual Check-in Section -->
            <div class="card">
                <h2 class="section-title">TERMINAL ACCESS / CHECK-IN</h2>
                <div class="flex-row">
                    <input type="text" id="scan-input" class="admin-input" placeholder="ENTER BOOKING CODE (EX: BC-123456)" autocomplete="off">
                    <button class="btn-checkin" onclick="checkInManual()">[ SCAN & CHECK-IN ]</button>
                </div>
                <p id="checkin-msg" class="msg" style="margin-top: 15px; font-family: 'Orbitron', sans-serif;"></p>
            </div>

            <!-- Schedule Section -->
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
                    <h2 class="section-title" style="margin: 0; border: none; padding: 0;">MISSION DATE: <input type="date" id="adminDate" class="admin-input" style="width:auto; padding: 5px 15px; margin-left: 10px;" onchange="loadSchedule()"></h2>
                    <button class="btn-refresh" onclick="loadSchedule()">[ RELOAD DATABANKS ]</button>
                </div>
                
                <div class="table-responsive">
                    <table class="schedule-table">
                        <thead>
                            <tr>
                                <th>Time / Slot</th>
                                <th>Facility</th>
                                <th>Player Info</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="schedule-body">
                            <!-- Populated via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="tab-history" class="tab-content">
            <div class="card">
                <h2 class="section-title">ARCHIVES / HISTORY</h2>
                <p style="margin-bottom: 20px; color: #aaa;">รายการการจองทั้งหมดที่เกิดขึ้น (ไม่รวมที่ยกเลิกแล้ว)</p>
                
                <div class="table-responsive">
                    <table class="schedule-table">
                        <thead>
                            <tr>
                                <th>Ref</th>
                                <th>Date/Time</th>
                                <th>Facility</th>
                                <th>Player Info</th>
                                <th>Timestamp</th>
                            </tr>
                        </thead>
                        <tbody id="history-body">
                            <!-- Populated via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script>
    <script>
        // Modal functions not in admin.js
        let pendingConfirmFn = null;
        function showConfirmModal(message, confirmFn) {
            document.getElementById('confirmMessage').innerText = message;
            pendingConfirmFn = confirmFn;
            document.getElementById('confirmModal').style.display = 'flex';
        }
        function closeConfirmModal() {
            document.getElementById('confirmModal').style.display = 'none';
            pendingConfirmFn = null;
        }
        document.getElementById('confirmBtn').onclick = () => {
            if (pendingConfirmFn) pendingConfirmFn();
            closeConfirmModal();
        };

        // Override the window.confirm in admin.js to use our modal
        // admin.js uses window.confirm in updateStatus
        const originalConfirm = window.confirm;
        window.confirm = function(msg) {
            // We can't really override synchronous confirm with async modal easily without rewriting admin.js updateStatus
            // Let's just return true for now and let admin.js handle it, or we could let it use standard confirm.
            return originalConfirm(msg);
        };
    </script>
</body>
</html>
