<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base Camp - Admin Dashboard</title>
    
    
    
    <link rel="stylesheet" href="css/style.css">
    <style>
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            padding: 10px 25px;
            background: #e2e8f0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-muted);
            transition: 0.3s;
        }
        .tab-btn.active {
            background: var(--primary-color);
            color: white;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .btn-sm-checkin {
            background: #27ae60;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 13px;
        }
        .btn-sm-doc {
            background: #3182ce;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 13px;
        }
        .btn-cancel {
            font-size: 13px;
            padding: 6px 12px;
        }
    </style>
</head>
<body class="admin-body">
    <header class="admin-header">
        <div style="display: flex; align-items: center; gap: 15px;">
            <img src="/images/logo.png" alt="Base Camp" style="max-height: 50px; width: auto; filter: brightness(0) invert(1);">
            <h1>Admin Dashboard</h1>
        </div>
        <p>จัดการคิวห้องเกม Base Camp &bull; <span id="current-date"></span></p>
    </header>

    <div class="admin-container">
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('schedule')">📅 Schedule (ตารางงาน)</button>
            <button class="tab-btn" onclick="switchTab('history')">📜 History & Logs (ประวัติ/เอกสาร)</button>
        </div>

        <div id="tab-schedule" class="tab-content active">
            <!-- Manual Check-in Section -->
            <div class="card">
                <h2 class="section-title">CHECK-IN / ค้นหารหัสการจอง</h2>
                <div class="flex-row">
                    <input type="text" id="scan-input" class="admin-input" placeholder="Ex. BC-123456" autocomplete="off">
                    <button class="btn-checkin" onclick="checkInManual()">Check-in</button>
                </div>
                <p id="checkin-msg" class="msg"></p>
            </div>

            <!-- Schedule Section -->
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
                    <h2 class="section-title" style="margin: 0;">SCHEDULE: <input type="date" id="adminDate" class="admin-input" style="width:auto; padding: 5px 10px;" onchange="loadSchedule()"></h2>
                    <button class="btn-refresh" onclick="loadSchedule()">🔄 Refresh</button>
                </div>
                
                <div class="table-responsive">
                    <table class="schedule-table">
                        <thead>
                            <tr>
                                <th>Ref Code</th>
                                <th>Slot</th>
                                <th>Time</th>
                                <th>Room</th>
                                <th>Guest Name</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="schedule-body">
                            <tr><td colspan="7" style="text-align: center;">กำลังโหลดข้อมูล...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="tab-history" class="tab-content">
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
                    <h2 class="section-title" style="margin: 0;">ประวัติการเข้าใช้งาน: 
                        <input type="date" id="historyDate" class="admin-input" style="width:auto; padding: 5px 10px;" onchange="loadHistory()">
                    </h2>
                    <button class="btn-refresh" onclick="loadHistory()">🔄 Refresh</button>
                </div>
                
                <div class="table-responsive">
                    <table class="schedule-table">
                        <thead>
                            <tr>
                                <th>Ref Code</th>
                                <th>Date/Time</th>
                                <th>Room</th>
                                <th>Guest Name</th>
                                <th>Status</th>
                                <th>Document</th>
                            </tr>
                        </thead>
                        <tbody id="history-body">
                            <tr><td colspan="6" style="text-align: center;">กรุณาเลือกวันที่...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script src="js/admin.js"></script>
</body>
</html>
