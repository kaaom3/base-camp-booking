<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base Camp Hotel - Select Language</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        /* === BASE CAMP SPLASH SCREEN STYLES === */
        #splash-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: opacity 0.8s ease-in-out;
        }

        #splash-screen::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 8px;
            background: linear-gradient(90deg, #0011ff 0%, #ff3a00 55%, #ffd600 100%);
        }

        /* The container holding the sliced logo */
        .logo-assembly {
            position: relative;
            width: 200px;
            height: 200px;
            perspective: 1000px;
        }

        /* Each slice of the logo */
        .logo-slice {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url('images/logo.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0;
        }

        /* Slice 1: Top */
        .slice-1 {
            clip-path: inset(0 0 66% 0);
            animation: assembleSlice1 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            animation-delay: 0.15s;
        }
        @keyframes assembleSlice1 {
            0% { transform: translateY(-80px) scale(0.9); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        /* Slice 2: Middle */
        .slice-2 {
            clip-path: inset(34% 0 34% 0);
            animation: assembleSlice2 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            animation-delay: 0.4s;
        }
        @keyframes assembleSlice2 {
            0% { transform: translateX(100px) scale(0.9); opacity: 0; }
            100% { transform: translateX(0) scale(1); opacity: 1; }
        }

        /* Slice 3: Bottom */
        .slice-3 {
            clip-path: inset(66% 0 0 0);
            animation: assembleSlice3 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            animation-delay: 0.65s;
        }
        @keyframes assembleSlice3 {
            0% { transform: translateY(80px) scale(0.9); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        /* The full logo that appears after assembly */
        .logo-full {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url('images/logo.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0;
            animation: logoReveal 1.5s ease-in-out forwards;
            animation-delay: 1.7s;
        }
        @keyframes logoReveal {
            0% { opacity: 0; filter: drop-shadow(0 4px 12px rgba(0, 17, 255, 0.1)); transform: scale(0.98); }
            50% { opacity: 1; filter: drop-shadow(0 12px 28px rgba(255, 58, 0, 0.25)); transform: scale(1.03); }
            100% { opacity: 1; filter: drop-shadow(0 8px 20px rgba(0, 17, 255, 0.15)); transform: scale(1); }
        }

        .splash-title {
            margin-top: 24px;
            font-family: 'Kanit', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-color);
            letter-spacing: 1px;
            opacity: 0;
            animation: textFadeIn 0.8s ease forwards;
            animation-delay: 2.0s;
        }

        /* Enter button */
        .enter-text {
            margin-top: 18px;
            font-family: 'Kanit', sans-serif;
            background: var(--accent-color);
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1px;
            opacity: 0;
            cursor: pointer;
            animation: textFadeIn 0.8s ease forwards;
            animation-delay: 2.3s;
            padding: 12px 34px;
            border: none;
            border-radius: 30px;
            box-shadow: 0 8px 20px rgba(255, 58, 0, 0.3);
            transition: all 0.25s ease;
        }
        .enter-text:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(255, 58, 0, 0.4);
        }

        @keyframes textFadeIn {
            to { opacity: 1; }
        }

        /* === MAIN PAGE STYLES === */
        .lang-container {
            padding: 50px 30px;
            text-align: center;
        }
        .lang-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
            background: white;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
            padding: 20px;
            font-size: 20px;
            font-weight: 500;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            margin-bottom: 20px;
            transition: all 0.3s;
        }
        .lang-btn:hover {
            background: var(--primary-color);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 17, 255, 0.15);
        }
        .lang-btn:hover .flag {
            color: #ffd600;
        }
        .flag { font-size: 24px; font-weight: bold; color: var(--accent-color); transition: color 0.3s; }
        
        #main-content {
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }
    </style>
</head>
<body>

    <!-- SPLASH SCREEN -->
    <div id="splash-screen" onclick="enterApp()">
        <div class="logo-assembly">
            <div class="logo-slice slice-1"></div>
            <div class="logo-slice slice-2"></div>
            <div class="logo-slice slice-3"></div>
            <div class="logo-full"></div>
        </div>
        <div class="splash-title">BASE CAMP HOTEL</div>
        <div class="enter-text" id="enter-btn">แตะเพื่อเข้าสู่ระบบ • TAP TO ENTER</div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="app-wrapper" style="max-width: 500px;" id="main-content">
        <div class="hero-header">
            <img src="images/logo.png" alt="Base Camp Hotel" style="max-height: 100px; width: auto; margin-bottom: 10px;">
            <p>Welcome / ยินดีต้อนรับ</p>
        </div>
        <div class="content-body lang-container">
            <h3 style="margin-bottom: 30px; color: var(--text-main);">Please select your language<br>กรุณาเลือกภาษา</h3>
            
            <a href="en.html" class="lang-btn">
                <span class="flag">EN</span> English
            </a>
            <a href="th.html" class="lang-btn">
                <span class="flag">TH</span> ภาษาไทย
            </a>
        </div>
    </div>

    <script>
        // Automatic fallback: if user doesn't tap, enter app automatically after 4.5 seconds
        let autoEnterTimer = setTimeout(() => {
            enterApp();
        }, 4500);

        function enterApp() {
            clearTimeout(autoEnterTimer);
            const splash = document.getElementById('splash-screen');
            const mainContent = document.getElementById('main-content');
            
            splash.style.opacity = '0';
            setTimeout(() => {
                splash.style.display = 'none';
                mainContent.style.opacity = '1';
            }, 800);
        }
    </script>
</body>
</html>
