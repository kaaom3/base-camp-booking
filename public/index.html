<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Language / เลือกภาษา</title>
    
    
    
    <link rel="stylesheet" href="css/style.css">
    <style>
        .lang-container {
            padding: 50px 30px;
            text-align: center;
        }
        .lang-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
            background: white;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
            padding: 20px;
            font-size: 20px;
            font-weight: 500;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            margin-bottom: 20px;
            transition: all 0.3s;
        }
        .lang-btn:hover {
            background: var(--primary-color);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .flag { font-size: 24px; font-weight: bold; color: var(--accent-color); }
    </style>
</head>
<body>
    <div class="app-wrapper" style="max-width: 500px;">
        <div class="hero-header">
            <img src="/images/logo.png" alt="Base Camp Hotel" style="max-height: 100px; width: auto; margin-bottom: 10px;">
            <p>Welcome / ยินดีต้อนรับ</p>
        </div>
        <div class="content-body lang-container">
            <h3 style="margin-bottom: 30px; color: var(--text-main);">Please select your language<br>กรุณาเลือกภาษา</h3>
            
            <a href="en.html" class="lang-btn">
                <span class="flag">EN</span> English
            </a>
            <a href="th.html" class="lang-btn">
                <span class="flag">TH</span> ภาษาไทย
            </a>
        </div>
    </div>
</body>
</html>
